<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>图片转3D工具工作台</title>
  <style>
    body { font-family: system-ui; background: #111; color: #eee; padding: 2rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; }
    .card { background: #1e1e24; border-radius: 12px; padding: 1.2rem; }
    .card h3 { margin: 0 0 .5rem; }
    .card p { font-size: .85rem; color: #aaa; margin: .3rem 0; }
    .tag { display: inline-block; font-size: .75rem; padding: 2px 8px; border-radius: 6px; margin-right: 4px; }
    .free { background: #1a4d2e; color: #7fdfa8; }
    .login { background: #4d3a1a; color: #dfc47f; }
    a.btn { display: inline-block; margin-top: .8rem; padding: .5rem 1rem; background: #4f8cff; color: #fff; border-radius: 8px; text-decoration: none; font-size: .9rem; }
  </style>
</head>
<body>
  <h1>图片转3D · 免费工具工作台</h1>
  <div class="grid">
    <div class="card">
      <h3>three.ws Workbench</h3>
      <span class="tag free">免登录</span>
      <p>浏览器桌面级工作流，去背景→网格→绑定→导出</p>
      <p>导出：GLB / OBJ / STL / PLY</p>
      <a class="btn" href="https://three.ws/workbench" target="_blank">打开</a>
    </div>
    <div class="card">
      <h3>3D Valley</h3>
      <span class="tag free">免登录</span>
      <p>照片/描述约1分钟出带纹理模型，含后处理工具</p>
      <p>导出：GLB / OBJ / STL</p>
      <a class="btn" href="https://3dvalley.com" target="_blank">打开</a>
    </div>
    <div class="card">
      <h3>腾讯混元3D</h3>
      <span class="tag login">需登录</span>
      <p>每日20次免费，国内最稳，PBR纹理</p>
      <p>导出：GLB等</p>
      <a class="btn" href="https://3d.hunyuan.tencent.com" target="_blank">打开</a>
    </div>
    <div class="card">
      <h3>Tripo AI</h3>
      <span class="tag login">需登录</span>
      <p>每月约200-300积分，多视图输入</p>
      <p>导出：GLB / OBJ / FBX / STL / USD</p>
      <a class="btn" href="https://www.tripo3d.ai" target="_blank">打开</a>
    </div>
  </div>
</body>
</html>
