<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>日常任务</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: #f4f5f7;
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #1c1d22;
  }
  .app {
    max-width: 560px;
    margin: 0 auto;
    padding: 32px 16px 60px;
  }
  header {
    margin-bottom: 18px;
  }
  h1 {
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 4px;
  }
  #date {
    font-size: 13px;
    color: #8a8f99;
    margin: 0;
  }

  /* 输入行：输入框占满，按钮固定在右侧 */
  .input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 18px;
  }
  #input {
    flex: 1;
    min-width: 0;
    padding: 12px 14px;
    font-size: 15px;
    border: 1.5px solid #dfe2e8;
    border-radius: 10px;
    background: #fff;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  #input:focus {
    border-color: #3b82f6;
    box-shadow: 0 0 0 3px rgba(59,130,246,.15);
  }
  #add {
    flex: none;
    padding: 0 18px;
    font-size: 15px;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    background: #2563eb;
    color: #fff;
    cursor: pointer;
    transition: background .15s;
  }
  #add:hover { background: #1d4ed8; }
  #add:active { transform: translateY(1px); }

  /* 任务列表 */
  #list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .task {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 1px 2px rgba(0,0,0,.05);
    border: 1px solid #eceef2;
  }
  .task .text {
    flex: 1;
    min-width: 0;
    font-size: 15px;
    line-height: 1.4;
    word-break: break-word;
    transition: color .2s;
  }
  .task.done .text {
    text-decoration: line-through;
    color: #a0a5af;
  }

  /* 开关：关=红，开=绿 */
  .switch {
    flex: none;
    position: relative;
    width: 48px;
    height: 27px;
    border: none;
    border-radius: 14px;
    background: #ef4444;
    cursor: pointer;
    transition: background .2s;
    padding: 0;
  }
  .switch::after {
    content: "";
    position: absolute;
    top: 3px;
    left: 3px;
    width: 21px;
    height: 21px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 1px 3px rgba(0,0,0,.25);
    transition: transform .2s;
  }
  .switch.on { background: #22c55e; }
  .switch.on::after { transform: translateX(21px); }

  /* 删除按钮：低调常驻，悬停变红 */
  .del {
    flex: none;
    width: 26px;
    height: 26px;
    border: none;
    border-radius: 6px;
    background: transparent;
    color: #c3c7cf;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    transition: color .15s, background .15s;
  }
  .del:hover { color: #ef4444; background: #fef2f2; }

  #empty {
    text-align: center;
    color: #a0a5af;
    font-size: 14px;
    padding: 36px 0;
  }
  #stats {
    text-align: center;
    font-size: 13px;
    color: #8a8f99;
    margin-top: 20px;
    min-height: 18px;
  }

  @media (max-width: 420px) {
    .app { padding: 22px 12px 50px; }
    h1 { font-size: 20px; }
    #add { padding: 0 14px; font-size: 14px; }
  }
</style>
</head>
<body>
  <div class="app">
    <header>
      <h1>日常任务</h1>
      <p id="date"></p>
    </header>

    <div class="input-row">
      <input id="input" type="text" maxlength="100"
        placeholder="输入任务，按回车或点添加" autocomplete="off" />
      <button id="add">添加</button>
    </div>

    <ul id="list"></ul>
    <div id="empty">还没有任务，先加一条吧</div>
    <div id="stats"></div>
  </div>

<script>
  const KEY = "daily-tasks";
  const inputEl = document.getElementById("input");
  const addBtn = document.getElementById("add");
  const listEl = document.getElementById("list");
  const emptyEl = document.getElementById("empty");
  const statsEl = document.getElementById("stats");

  let tasks = [];
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) tasks = JSON.parse(raw);
    if (!Array.isArray(tasks)) tasks = [];
  } catch (e) {
    tasks = [];
  }

  function save() {
    localStorage.setItem(KEY, JSON.stringify(tasks));
  }

  function render() {
    listEl.innerHTML = "";

    tasks.forEach((task) => {
      const li = document.createElement("li");
      li.className = "task" + (task.done ? " done" : "");

      // 开关
      const sw = document.createElement("button");
      sw.className = "switch" + (task.done ? " on" : "");
      sw.setAttribute("aria-label", task.done ? "标记为未完成" : "标记为完成");
      sw.addEventListener("click", () => {
        task.done = !task.done;
        save();
        render();
      });

      // 任务文字
      const text = document.createElement("span");
      text.className = "text";
      text.textContent = task.text;

      // 删除（保持界面干净，做得很低调）
      const del = document.createElement("button");
      del.className = "del";
      del.textContent = "×";
      del.setAttribute("aria-label", "删除任务");
      del.addEventListener("click", () => {
        tasks = tasks.filter((t) => t.id !== task.id);
        save();
        render();
      });

      li.append(sw, text, del);
      listEl.appendChild(li);
    });

    emptyEl.style.display = tasks.length ? "none" : "block";

    const done = tasks.filter((t) => t.done).length;
    statsEl.textContent = tasks.length
      ? `已完成 ${done} / 共 ${tasks.length}`
      : "";
  }

  function addTask() {
    const value = inputEl.value.trim();
    if (!value) {
      inputEl.focus();
      return;
    }
    tasks.push({
      id: Date.now() + "-" + Math.random().toString(36).slice(2, 7),
      text: value,
      done: false,
    });
    inputEl.value = "";
    inputEl.focus();
    save();
    render();
  }

  addBtn.addEventListener("click", addTask);
  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      addTask();
    }
  });

  // 顶部日期
  document.getElementById("date").textContent = new Date().toLocaleDateString("zh-CN", {
    month: "long",
    day: "numeric",
    weekday: "long",
  });

  render();
</script>
</body>
</html>
